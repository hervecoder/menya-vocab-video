name: Menya Vocab Video

# Manual only. Every field is pre-filled with test content, so the first
# run needs no typing at all: just press "Run workflow".
on:
  workflow_dispatch:
    inputs:
      batch_file:
        description: 'Batch JSON path in the repo'
        required: true
        default: 'data/vocabulary_pilot_videos.json'
      video_id:
        description: 'Batch id (word_01..word_10 or sentence_01..sentence_06)'
        required: true
        default: 'word_01'
      note:
        description: 'Yellow box text. The brand name is highlighted in green.'
        required: true
        default: 'Iyi app yitwa "Menya Icyongereza App" wayisanga kuri Play Store yigisha icyongereza'
      brand:
        description: 'Text to highlight green inside the note'
        required: false
        default: 'Menya Icyongereza App'
      duration:
        description: 'Video length in seconds'
        required: false
        default: '6'

permissions:
  contents: write

concurrency:
  group: menya-vocab-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Check ffmpeg
        run: ffmpeg -version | head -n 1

      - name: Generate frame + video
        env:
          BATCH_FILE: ${{ inputs.batch_file }}
          VIDEO_ID: ${{ inputs.video_id }}
          NOTE: ${{ inputs.note }}
          BRAND: ${{ inputs.brand }}
          DURATION: ${{ inputs.duration }}
        run: |
          python generate.py \
            --batch-json "$BATCH_FILE" \
            --video-id "$VIDEO_ID" \
            --note "$NOTE" \
            --brand "$BRAND" \
            --duration "$DURATION" \
            --preview "preview/${VIDEO_ID}.png" \
            --out "output/${VIDEO_ID}.mp4" \
            --video

      - name: Commit video to the repo
        env:
          VIDEO_ID: ${{ inputs.video_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/${VIDEO_ID}.mp4" "preview/${VIDEO_ID}.png"
          if git diff --staged --quiet; then
            echo "No new output to commit."
          else
            git commit -m "Add Menya vocab video ${VIDEO_ID} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: menya-vocab-video
          path: |
            output/*.mp4
            preview/*.png
          if-no-files-found: error

      - name: Summary
        env:
          VIDEO_ID: ${{ inputs.video_id }}
        run: |
          echo "### Menya Vocab Video" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Batch:** \`$VIDEO_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Video:** \`output/$VIDEO_ID.mp4\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Frame:** \`preview/$VIDEO_ID.png\`" >> "$GITHUB_STEP_SUMMARY"
