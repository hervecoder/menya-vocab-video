name: Menya Vocab Video

# Manual only. Leave every field as-is and press "Run workflow". The script
# picks the next content from data/rotation_manifest.json, renders it, then
# advances data/rotation_state.json. After the last content it starts again
# from content_0001. Use content_id only to replay a specific video.
on:
  workflow_dispatch:
    inputs:
      content_id:
        description: 'Optional replay id (e.g. content_0001). Leave empty for auto-next.'
        required: false
        default: ''
      note:
        description: 'Yellow box text. The brand name is highlighted in green.'
        required: true
        default: 'Iyi app yitwa "Menya Icyongereza App" wayisanga kuri Play Store yigisha icyongereza'
      brand:
        description: 'Text to highlight green inside the note'
        required: false
        default: 'Menya Icyongereza App'
      duration:
        description: 'Video length in seconds'
        required: false
        default: '6'

permissions:
  contents: write

concurrency:
  group: menya-vocab-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate rotation database
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          EXPECTED_VIDEOS = 1098
          manifest_path = Path("data/rotation_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          jobs = manifest.get("jobs") or []
          chunks = manifest.get("chunks") or []

          if len(jobs) != EXPECTED_VIDEOS:
              raise SystemExit(
                  f"rotation database has {len(jobs)} jobs; "
                  f"expected {EXPECTED_VIDEOS}"
              )
          if len(chunks) != 4:
              raise SystemExit(
                  f"rotation database has {len(chunks)} chunks; expected 4"
              )
          if manifest.get("meta", {}).get("unique_videos") != EXPECTED_VIDEOS:
              raise SystemExit("manifest does not report 1098 unique videos")

          chunk_cache = {}
          seen = set()
          previous_words = None
          for index, entry in enumerate(jobs):
              chunk_id = int(entry["chunk_id"])
              chunk = chunk_cache.get(chunk_id)
              if chunk is None:
                  chunk_path = manifest_path.parent / chunks[chunk_id - 1]["file"]
                  if not chunk_path.exists():
                      raise SystemExit(f"missing chunk file: {chunk_path}")
                  chunk = json.loads(chunk_path.read_text(encoding="utf-8"))
                  chunk_cache[chunk_id] = chunk
              job = chunk["jobs"][int(entry["job_index"])]
              if job.get("id") != entry.get("id"):
                  raise SystemExit(
                      f"job mismatch at {index}: {entry.get('id')} != {job.get('id')}"
                  )
              pairs = job.get("pairs") or []
              if len(pairs) != 7:
                  raise SystemExit(
                      f"{entry.get('id')} has {len(pairs)} pairs; expected 7"
                  )
              signature = tuple(
                  sorted(
                      (
                          str(pair["english"]).strip().casefold(),
                          str(pair["kinyarwanda"]).strip().casefold(),
                      )
                      for pair in pairs
                  )
              )
              if signature in seen:
                  raise SystemExit(f"duplicate video signature at {entry.get('id')}")
              seen.add(signature)

              words = {
                  str(pair["english"]).strip().casefold() for pair in pairs
              }
              if len(words) != 7:
                  raise SystemExit(f"{entry.get('id')} repeats a word")
              if previous_words is not None and index >= 10:
                  overlap = previous_words & words
                  if overlap:
                      raise SystemExit(
                          f"{entry.get('id')} shares words with the previous "
                          f"video: {sorted(overlap)}"
                      )
              previous_words = words

          print(
              f"database OK: {len(jobs)} unique 7-word videos, "
              f"{len(chunks)} chunks"
          )
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Check ffmpeg
        run: ffmpeg -version | head -n 1

      - name: Pick next content
        id: pick
        env:
          CONTENT_ID: ${{ inputs.content_id }}
        run: |
          if [ -n "$CONTENT_ID" ]; then
            python scripts/rotation.py select \
              --manifest data/rotation_manifest.json \
              --state data/rotation_state.json \
              --content-id "$CONTENT_ID" \
              --out "$RUNNER_TEMP/current_job.json" \
              --pending "$RUNNER_TEMP/pending.json" \
              --github-output "$GITHUB_OUTPUT"
          else
            python scripts/rotation.py next \
              --manifest data/rotation_manifest.json \
              --state data/rotation_state.json \
              --out "$RUNNER_TEMP/current_job.json" \
              --pending "$RUNNER_TEMP/pending.json" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Generate frame + video
        env:
          CONTENT_ID: ${{ steps.pick.outputs.content_id }}
          NOTE: ${{ inputs.note }}
          BRAND: ${{ inputs.brand }}
          DURATION: ${{ inputs.duration }}
        run: |
          python generate.py \
            --batch-json "$RUNNER_TEMP/current_job.json" \
            --note "$NOTE" \
            --brand "$BRAND" \
            --duration "$DURATION" \
            --preview "preview/${CONTENT_ID}.png" \
            --out "output/${CONTENT_ID}.mp4" \
            --video

      - name: Advance rotation
        if: inputs.content_id == ''
        env:
          CONTENT_ID: ${{ steps.pick.outputs.content_id }}
        run: |
          python scripts/rotation.py advance \
            --manifest data/rotation_manifest.json \
            --state data/rotation_state.json \
            --pending "$RUNNER_TEMP/pending.json"

      - name: Commit video, preview and rotation state
        env:
          CONTENT_ID: ${{ steps.pick.outputs.content_id }}
          CYCLE: ${{ steps.pick.outputs.cycle }}
          AUTO: ${{ steps.pick.outputs.auto }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/${CONTENT_ID}.mp4" "preview/${CONTENT_ID}.png"
          if [ "$AUTO" = "true" ]; then
            git add data/rotation_state.json
          fi
          if git diff --staged --quiet; then
            echo "No new output to commit."
          else
            git commit -m "Add Menya vocab video ${CONTENT_ID} (cycle ${CYCLE}) ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git pull --rebase origin main
            git push
          fi

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: menya-vocab-video
          path: |
            output/${{ steps.pick.outputs.content_id }}.mp4
            preview/${{ steps.pick.outputs.content_id }}.png
          if-no-files-found: error

      - name: Summary
        env:
          CONTENT_ID: ${{ steps.pick.outputs.content_id }}
          CONTENT_NUMBER: ${{ steps.pick.outputs.content_number }}
          TOTAL_JOBS: ${{ steps.pick.outputs.total_jobs }}
          MODE: ${{ steps.pick.outputs.mode }}
          PAIR_COUNT: ${{ steps.pick.outputs.pair_count }}
          ENTRY_START: ${{ steps.pick.outputs.entry_start }}
          ENTRY_END: ${{ steps.pick.outputs.entry_end }}
          TOTAL_ENTRIES: ${{ steps.pick.outputs.total_entries }}
          INPUT_ENTRIES: ${{ steps.pick.outputs.input_entries }}
          REMAINDER_ENTRIES: ${{ steps.pick.outputs.remainder_entries }}
          EXCLUDED_ENTRIES: ${{ steps.pick.outputs.excluded_unverified_entries }}
          CYCLE: ${{ steps.pick.outputs.cycle }}
          NEXT_CONTENT_ID: ${{ steps.pick.outputs.next_content_id }}
          NEXT_CYCLE: ${{ steps.pick.outputs.next_cycle }}
          AUTO: ${{ steps.pick.outputs.auto }}
        run: |
          echo "### Menya Vocab Video" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Database:** 1098 unique videos (4 chunks, no duplicate video signatures)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Content:** \`$CONTENT_ID\` ($CONTENT_NUMBER/$TOTAL_JOBS, $MODE, $PAIR_COUNT pairs)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Entry range:** $ENTRY_START–$ENTRY_END of $TOTAL_ENTRIES" >> "$GITHUB_STEP_SUMMARY"
          echo "**Cycle:** $CYCLE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUTO" = "true" ]; then
            echo "**Next:** \`$NEXT_CONTENT_ID\` (cycle $NEXT_CYCLE)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Manual replay:** rotation state not advanced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$REMAINDER_ENTRIES" != "0" ] || [ "$EXCLUDED_ENTRIES" != "0" ]; then
            echo "**Coverage:** $TOTAL_ENTRIES of $INPUT_ENTRIES entries in verified videos; $REMAINDER_ENTRIES remainder; $EXCLUDED_ENTRIES excluded from rotation." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "**Video:** \`output/$CONTENT_ID.mp4\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Frame:** \`preview/$CONTENT_ID.png\`" >> "$GITHUB_STEP_SUMMARY"
